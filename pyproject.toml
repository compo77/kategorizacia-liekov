[project]
name = "kategorizacia-liekov"
version = "0.1.0"
description = "ATC medicine comparison Flask application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "Flask>=3.0,<4",
    "gunicorn>=22,<24",
    "openpyxl>=3.1,<4",
    "PyYAML>=6.0,<7",
    "requests>=2.31,<3",
]

[dependency-groups]
dev = [
    "black",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-openpyxl",
    "types-PyYAML",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = [
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".venv-dev",
    ".venv-prod",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "W",
]
ignore = []

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
check_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
